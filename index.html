
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AV MUSIC</title>

<style>
* { box-sizing:border-box; }

body {
  margin:0;
  padding:30px 15px;
  background:#10131c;
  color:white;
  font-family:Arial,sans-serif;
}

.app { max-width:850px; margin:auto; }

header, .row {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
}

header { margin-bottom:25px; }
h1 { color:#56e5b0; }

.panel {
  background:#202637;
  padding:25px;
  border-radius:20px;
  margin-bottom:20px;
}

.center { text-align:center; }
.muted { color:#aab5c9; }

.cover {
  width:150px;
  height:150px;
  background:#343e54;
  border-radius:15px;
  display:grid;
  place-items:center;
  margin:auto;
  font-size:75px;
  color:#56e5b0;
}

#title { overflow-wrap:anywhere; }

button {
  cursor:pointer;
  border:none;
  border-radius:10px;
  padding:12px;
  background:#343e54;
  color:white;
  font-size:15px;
}

button:hover { filter:brightness(1.15); }
button:disabled { opacity:.5; cursor:default; }

.primary {
  background:#56e5b0;
  color:#10131c;
  font-weight:bold;
}

.controls {
  display:flex;
  justify-content:center;
  gap:25px;
  align-items:center;
  margin:22px 0;
}

.controls button { font-size:25px; }

#play {
  border-radius:50%;
  width:65px;
  height:65px;
}

input[type=range] {
  width:100%;
  accent-color:#56e5b0;
}

input[type=search] {
  width:100%;
  background:#343e54;
  color:white;
  border:none;
  border-radius:10px;
  padding:13px;
  margin:15px 0;
}

.song {
  display:flex;
  align-items:center;
  gap:12px;
  padding:13px;
  margin:7px 0;
  border-radius:10px;
  background:#2a3143;
  cursor:pointer;
}

.song:hover { background:#39425a; }
.song.active { color:#56e5b0; }

.song span {
  flex:1;
  overflow-wrap:anywhere;
}

.song button { padding:6px 10px; }

#status, #libraryStatus { font-size:13px; }

@media(max-width:500px) {
  .row, header { flex-wrap:wrap; }
  .panel { padding:18px; }
}
</style>
</head>

<body>

<div class="app">

<header>
  <h1>♫ AV MUSIC</h1>
  <span class="muted">Arduino UNO R3 Controller</span>
</header>

<section class="panel center">

  <div class="cover">♫</div>

  <h2 id="title">Selecciona una canción</h2>

  <p id="counter" class="muted">
    Cargando biblioteca...
  </p>

  <input id="progress" type="range"
         min="0" max="100" value="0">

  <div class="row muted">
    <small id="elapsed">0:00</small>
    <small id="duration">0:00</small>
  </div>

  <div class="controls">
    <button id="prev">⏮</button>
    <button id="play" class="primary">▶</button>
    <button id="next">⏭</button>
  </div>

  <div class="row">
    <span>🔊 Volumen</span>
    <strong id="volumeValue">0%</strong>
  </div>

  <input id="volume" type="range"
         min="0" max="100" value="0"
         disabled>

</section>

<section class="panel">

  <div class="row">
    <h2>Mi biblioteca</h2>
    <button id="add" class="primary">
      + Agregar canciones
    </button>
  </div>

  <p class="muted" id="libraryStatus">
    Cargando canciones guardadas...
  </p>

  <input type="file" id="files"
         accept="audio/*,.mp3,.wav,.ogg,.m4a"
         multiple hidden>

  <input type="search" id="search"
         placeholder="Buscar canción...">

  <div id="playlist"></div>

</section>

<section class="panel">

  <div class="row">
    <div>
      <strong>Conexión Arduino</strong>
      <p id="status" class="muted">
        Desconectado
      </p>
    </div>

    <button id="connect" class="primary">
      Conectar Arduino
    </button>
  </div>

</section>

</div>

<audio id="audio"></audio>

<script>
const $ = id => document.getElementById(id);
const audio = $("audio");

let db;
let songs = [];
let current = -1;
let port = null;
let connecting = false;

// ===================================
// BASE DE DATOS PERMANENTE
// ===================================

function requestPromise(request) {
  return new Promise((resolve, reject) => {
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}

function openDatabase() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open("AVMusicDB", 1);

    request.onupgradeneeded = () => {
      const database = request.result;

      if (!database.objectStoreNames.contains("songs")) {
        database.createObjectStore("songs", {
          keyPath:"id",
          autoIncrement:true
        });
      }
    };

    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}

async function saveSong(file) {
  return new Promise((resolve, reject) => {
    const transaction =
      db.transaction("songs", "readwrite");

    const store = transaction.objectStore("songs");

    const request = store.add({
      name:file.name.replace(/\.[^.]+$/, ""),
      file:file
    });

    let id;

    request.onsuccess = () => {
      id = request.result;
    };

    transaction.oncomplete = () => resolve(id);
    transaction.onerror = () => reject(transaction.error);
    transaction.onabort = () => reject(transaction.error);
  });
}

async function getSavedSongs() {
  const transaction =
    db.transaction("songs", "readonly");

  return requestPromise(
    transaction.objectStore("songs").getAll()
  );
}

async function deleteSavedSong(id) {
  return new Promise((resolve, reject) => {
    const transaction =
      db.transaction("songs", "readwrite");

    transaction.objectStore("songs").delete(id);

    transaction.oncomplete = resolve;
    transaction.onerror = () => reject(transaction.error);
    transaction.onabort = () => reject(transaction.error);
  });
}

async function initializeLibrary() {
  try {
    db = await openDatabase();
    const saved = await getSavedSongs();

    songs = saved.map(song => ({
      id:song.id,
      name:song.name,
      url:URL.createObjectURL(song.file)
    }));

    if (songs.length) {
      loadSong(0, false);
    }

    $("libraryStatus").textContent =
      songs.length + " canciones guardadas";

    $("add").disabled = false;
    drawPlaylist();

  } catch (error) {
    $("libraryStatus").textContent =
      "Error: " + error.message;
  }
}

// ===================================
// BIBLIOTECA
// ===================================

function formatTime(seconds) {
  if (!Number.isFinite(seconds)) return "0:00";

  const m = Math.floor(seconds / 60);
  const s = Math.floor(seconds % 60);

  return m + ":" + String(s).padStart(2, "0");
}

function drawPlaylist() {
  const list = $("playlist");
  const search = $("search").value.toLowerCase();

  list.innerHTML = "";

  songs.forEach((song, index) => {
    if (!song.name.toLowerCase().includes(search))
      return;

    const row = document.createElement("div");

    row.className =
      "song" + (index === current ? " active" : "");

    const name = document.createElement("span");
    name.textContent = "♫  " + song.name;

    const remove = document.createElement("button");
    remove.textContent = "✕";
    remove.title = "Eliminar canción guardada";

    remove.onclick = async event => {
      event.stopPropagation();

      try {
        await removeSong(index);
      } catch (error) {
        alert("No se pudo eliminar: " + error.message);
      }
    };

    row.onclick = () => loadSong(index, true);

    row.append(name, remove);
    list.appendChild(row);
  });

  if (!songs.length) {
    list.textContent =
      "No hay canciones. Agrega tus MP3.";
  }
}

function loadSong(index, autoplay = false) {
  if (!songs.length) return;

  current = (index + songs.length) % songs.length;

  audio.src = songs[current].url;

  $("title").textContent = songs[current].name;

  $("counter").textContent =
    "Canción " + (current + 1) +
    " de " + songs.length;

  $("progress").value = 0;
  $("elapsed").textContent = "0:00";
  $("duration").textContent = "0:00";

  drawPlaylist();

  if (autoplay) playMusic();
  else $("play").textContent = "▶";
}

async function playMusic() {
  if (current < 0) return;

  try {
    await audio.play();
    $("play").textContent = "⏸";
  } catch (error) {
    $("status").textContent =
      "Pulsa Play para activar el audio";
  }
}

function togglePlay() {
  if (!songs.length) return;

  if (current < 0) loadSong(0);

  if (audio.paused) {
    playMusic();
  } else {
    audio.pause();
    $("play").textContent = "▶";
  }
}

function nextSong() {
  if (songs.length) {
    loadSong(current + 1, true);
  }
}

function prevSong() {
  if (songs.length) {
    loadSong(current - 1, true);
  }
}

async function removeSong(index) {
  const song = songs[index];
  const wasCurrent = index === current;
  const wasPlaying = !audio.paused;

  await deleteSavedSong(song.id);

  if (wasCurrent) {
    audio.pause();
    audio.removeAttribute("src");
    audio.load();
  }

  songs.splice(index, 1);
  URL.revokeObjectURL(song.url);

  if (!songs.length) {
    current = -1;
    $("title").textContent = "Selecciona una canción";
    $("counter").textContent = "Biblioteca vacía";
    $("play").textContent = "▶";
    $("progress").value = 0;
    $("elapsed").textContent = "0:00";
    $("duration").textContent = "0:00";

  } else if (wasCurrent) {
    current = -1;

    loadSong(
      Math.min(index, songs.length - 1),
      wasPlaying
    );

  } else if (index < current) {
    current--;
  }

  $("libraryStatus").textContent =
    songs.length + " canciones guardadas";

  drawPlaylist();
}

// ===================================
// AGREGAR MP3
// ===================================

$("add").disabled = true;

$("add").onclick = () => $("files").click();

$("files").onchange = async event => {
  if (!db) return;

  const files = Array.from(event.target.files);

  $("add").disabled = true;

  let failed = 0;

  for (const file of files) {
    try {
      const id = await saveSong(file);

      songs.push({
        id:id,
        name:file.name.replace(/\.[^.]+$/, ""),
        url:URL.createObjectURL(file)
      });

    } catch (error) {
      console.error(error);
      failed++;
    }
  }

  if (current === -1 && songs.length) {
    loadSong(0, false);
  }

  $("libraryStatus").textContent =
    songs.length + " canciones guardadas" +
    (failed ? " (" + failed + " sin guardar)" : "");

  $("add").disabled = false;
  event.target.value = "";

  drawPlaylist();

  if (failed) {
    alert("Algunas canciones no se pudieron guardar.");
  }
};

$("search").oninput = drawPlaylist;

// ===================================
// REPRODUCTOR
// ===================================

$("play").onclick = togglePlay;
$("next").onclick = nextSong;
$("prev").onclick = prevSong;

audio.onplay = () => {
  $("play").textContent = "⏸";
};

audio.onpause = () => {
  $("play").textContent = "▶";
};

audio.onended = nextSong;

audio.ontimeupdate = () => {
  $("elapsed").textContent =
    formatTime(audio.currentTime);

  if (Number.isFinite(audio.duration) &&
      audio.duration > 0) {

    $("progress").value =
      audio.currentTime / audio.duration * 100;
  }
};

audio.onloadedmetadata = () => {
  $("duration").textContent =
    formatTime(audio.duration);
};

$("progress").oninput = event => {
  if (Number.isFinite(audio.duration) &&
      audio.duration > 0) {

    audio.currentTime =
      audio.duration *
      Number(event.target.value) / 100;
  }
};

function setVolume(value) {
  const n = Math.max(
    0,
    Math.min(100, Number(value))
  );

  if (!Number.isFinite(n)) return;

  audio.volume = n / 100;

  $("volume").value = n;
  $("volumeValue").textContent = n + "%";
}

// ===================================
// ARDUINO - COMANDOS
// ===================================

function processArduino(line) {

  if (line.startsWith("VOL:")) {
    const value = parseInt(line.slice(4), 10);

    if (!Number.isNaN(value)) {
      setVolume(value);
    }
  }

  if (line === "CLICK:1") togglePlay();

  if (line === "CLICK:2") nextSong();

  if (line === "CLICK:3") prevSong();
}

// ===================================
// CONEXION ARDUINO UNO R3
// ===================================

$("connect").onclick = async () => {

  if (connecting || port) return;

  if (!("serial" in navigator)) {
    alert("Abre con Live Server en Chrome o Edge.");
    return;
  }

  connecting = true;
  $("connect").disabled = true;

  let reader = null;

  try {
    port = await navigator.serial.requestPort();

    await port.open({ baudRate:115200 });

    $("status").textContent = "Conectado ✅";
    $("connect").textContent = "Conectado";

    reader = port.readable.getReader();

    const decoder = new TextDecoder();
    let buffer = "";

    while (true) {
      const {value, done} = await reader.read();

      if (done) break;

      buffer += decoder.decode(value, {
        stream:true
      });

      const lines = buffer.split("\n");
      buffer = lines.pop();

      for (const line of lines) {
        processArduino(line.trim());
      }
    }

  } catch (error) {
    $("status").textContent =
      "Error: " + error.message;

  } finally {

    if (reader) {
      try { reader.releaseLock(); } catch(e) {}
    }

    if (port) {
      try { await port.close(); } catch(e) {}
      port = null;
    }

    connecting = false;
    $("connect").disabled = false;
    $("connect").textContent = "Conectar Arduino";

    if ($("status").textContent === "Conectado ✅") {
      $("status").textContent = "Desconectado";
    }
  }
};

initializeLibrary();
</script>

</body>
</html>
